[project]
name = "income-tax-agent"
version = "0.1.0"
description = "Question answering over the Indian Income-tax Act, 2025, with citations"
readme = "README.md"
authors = [
    { name = "gaurav-niranjan", email = "65671046+gaurav-niranjan@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.0",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.12",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.16",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.16.0",
    "rank-bm25>=0.2.2",
    "streamlit>=1.66.0",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
